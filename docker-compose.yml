version: '3.8'

services:
  # ===== TIER 1: Database (Critical) =====
  db:
    image: nginx:alpine
    stop_signal: SIGQUIT
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 5s
      timeout: 3s
      retries: 3
    labels:
      - "sdo.managed=true"
      - "sdo.service=db"
      - "sdo.tier=1"
    ports:
      - "8081:80"

  # ===== TIER 2: API Backend (Important) =====
  api:
    image: nginx:alpine
    stop_signal: SIGQUIT
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost && wget --spider -q http://db"]
      interval: 5s
      timeout: 3s
      retries: 3
    labels:
      - "sdo.managed=true"
      - "sdo.service=api"
      - "sdo.tier=2"
    # ports:
    #   - "8082:80"
    expose:
      - "80"

  # ===== TIER 3: Web Frontend (Standard) =====
  web-app:
    image: nginx:alpine
    stop_signal: SIGQUIT
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost && wget --spider -q http://api"]
      interval: 5s
      timeout: 3s
      retries: 3
    labels:
      - "sdo.managed=true"
      - "sdo.service=web-app"
      - "sdo.tier=3"

  # ===== Load Balancer =====
  nginx:
    image: nginx:alpine
    stop_signal: SIGQUIT
    restart: unless-stopped
    depends_on:
      web-app:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./upstreams:/etc/nginx/upstreams:ro
    ports:
      - "8089:80"

  # ===== Monitoring Stack =====
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    privileged: true

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana

  # === SDO UI (Frontend) ===
  sdo-ui:
    build:
      context: ./sdo-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Giao diện trên trình duyệt sẽ được map ra cổng 5174 của máy tính bạn
      - "5174:80"

volumes:
  prometheus_data:
  grafana_data:
