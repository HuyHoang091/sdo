global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Container metrics từ cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Host metrics từ Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SDO Agent metrics
  - job_name: 'sdo-agent'
    static_configs:
      - targets: ['host.docker.internal:9200']
    scrape_interval: 10s
