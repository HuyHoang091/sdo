events {
            worker_connections 1024;
        }

        http {
            resolver 127.0.0.11 valid=5s;

            server {
                listen 80;

                location / {
                    set $backend "http://web-app:80";
                    proxy_pass $backend;
                    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
                    proxy_connect_timeout 2s;
                }
            }
        }